name: method-gates

# Structural checks over this catalog. Every gate is local: this repository depends on no sibling.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gates:
    runs-on: ubuntu-latest
    steps:
      - { name: skills, uses: actions/checkout@v4, with: { path: repo, fetch-depth: 0 } }

      - name: Released changelog history
        env:
          SKILLS_HISTORY_BASE: "${{ github.event.pull_request.base.sha || github.event.before }}"
        run: sh repo/scripts/lint-released-changelog.sh

      - name: Current catalog surfaces
        run: sh repo/scripts/lint-current.sh repo

      - name: Gate mutation test
        run: sh repo/scripts/test-lint-current.sh repo
